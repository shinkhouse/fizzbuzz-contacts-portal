<h2 mat-dialog-title>Modify Columns</h2>
<mat-dialog-content class="mat-typography">
    <p>Choose columns to show and drag to change order. Small screens may not display all columns.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button color="primary" [mat-dialog-close]="columns" cdkFocusInitial>
        Done
    </button>
</mat-dialog-actions>
